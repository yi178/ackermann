# Crowding characteristics:
#   - Peak density at x=7-19m corridor section
#   - Multiple simultaneous crossing zones
#   - Speed variation: 0.55-1.5 m/s
#   - Unpredictable alcove entries creating sudden obstacles
#
# This scenario is designed to stress-test MPPI's:
#   - Multi-agent prediction
#   - Real-time replanning
#   - Safety margins in dense crowds
